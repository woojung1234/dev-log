title: dev-log
description: 프론트엔드 프로젝트 회고 — 왜 그 기술을 골랐고, 어떤 문제를 어떻게 풀었는지
lang: ko
plugins: # GitHub Pages 기본 플러그인: front matter 없는 .md 변환, README를 홈으로, .md 링크 변환, 첫 # 제목을 title로
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
defaults:
  - scope:
      path: ""
    values:
      layout: default
